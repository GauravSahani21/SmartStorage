services:
  # ── Full Stack Web Service (Node.js + React) ─────────────────────────────────
  - type: web
    name: smartstorage
    runtime: node
    # Note: no rootDir specified because the build script is in the root package.json
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false  # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this manually in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in the Render dashboard
    healthCheckPath: /api/health
    autoDeploy: true
