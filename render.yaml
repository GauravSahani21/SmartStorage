services:
  # ── Backend API (Node.js Web Service) ────────────────────────────────────────
  - type: web
    name: smartstorage-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false  # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this manually in the Render dashboard
      - key: CLIENT_URL
        sync: false  # Set to your Render frontend URL after first deploy
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in the Render dashboard
    healthCheckPath: /api/health
    autoDeploy: true

  # ── Frontend (Static Site) ────────────────────────────────────────────────────
  - type: web
    name: smartstorage-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your Render backend URL + /api e.g. https://smartstorage-api.onrender.com/api
    routes:
      # Send all routes to index.html so React Router works correctly
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
